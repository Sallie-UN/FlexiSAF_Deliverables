<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIE Text Generator</title>
    <link rel="stylesheet" href="sentence.css">
</head>
<body>
    <div class="container">
        <h1>Text Generator</h1>
        <p class="subtitle">Generate Words, Sentences, or Paragraphs</p>

        <div class="controls">
            <div class="input-group">
                <label for="type">Type:</label>
                <select id="type">
                    <option value="words">Words</option>
                    <option value="sentences">Sentences</option>
                    <option value="paragraphs">Paragraphs</option>
                </select>
            </div>

            <div class="input-group">
                <label for="count">Amount:</label>
                <input type="number" id="count" value="3" min="1" max="50">
            </div>

            <button id="generateBtn">Generate Content</button>
        </div>

        <div class="output-area">
            <div id="output">Your generated text will appear here...</div>
            <button id="copyBtn">Copy to Clipboard</button>
        </div>
    </div>

    <script src="sentence.js"></script>
</body>
</html>
