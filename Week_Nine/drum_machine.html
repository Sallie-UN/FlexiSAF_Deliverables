<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIE Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>AIE Drum Machine</h1>

    </header>

    <section id="drum-section">
      <div class="drum-container">
        <button class="drum-pad" data-sound="kick1">Kick 1</button>
        <button class="drum-pad" data-sound="kick2">Kick 2</button>
        <button class="drum-pad" data-sound="snare">Snare</button>

        <button class="drum-pad dark" data-sound="clap">Clap</button>
        <button class="drum-pad dark" data-sound="hihat1">Hi-Hat 1</button>
        <button class="drum-pad dark" data-sound="hihat2">Hi-Hat 2</button>

        <button class="drum-pad darker" data-sound="tom1">Tom 1</button>
        <button class="drum-pad darker" data-sound="tom2">Tom 2</button>
        <button class="drum-pad darkest" data-sound="cowbell">Cowbell</button>
      </div>

      <button id="play-sequence">▶ Play</button>
    </section>

    <a href="index.html">← Back to Home</a>

    <script src="drum.js"></script>
  </body>
</html>
