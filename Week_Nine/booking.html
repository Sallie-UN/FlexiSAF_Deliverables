<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Room Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Room Booking Form</h1>
      <p>Please fill in the form below to book a room in AIE hotels</p>
    </header>

    <hr />

    <form action="confirmation.html" method="get">
      <!-- Text input -->
      <label>Full Name:</label><br />
      <input type="text" name="fullname" required /><br /><br />

      <!-- Email input -->
      <label>Email Address:</label><br />
      <input type="email" name="email" required /><br /><br />

      <!-- Telephone number -->
      <label>Phone Number:</label><br />
      <input type="tel" name="phone" required /><br /><br />

      <!-- Number input -->
      <label>Number of Guests:</label><br />
      <input type="number" name="guests" min="1" max="10" /><br /><br />

      <!-- Date input -->
      <label>Check-in Date:</label><br />
      <input type="date" name="checkin" /><br /><br />

      <!-- Radio buttons -->
      <label>Room Type:</label><br />
      <input type="radio" name="room" value="Standard" /> Standard<br />
      <input type="radio" name="room" value="Deluxe" /> Deluxe<br />
      <input type="radio" name="room" value="Suite" /> Suite<br /><br />

      <!-- Select dropdown -->
      <label>Payment Method:</label><br />
      <select name="payment">
        <option>Cash</option>
        <option>Card</option>
        <option>Transfer</option></select
      ><br /><br />

      <!-- Checkbox -->
      <input type="checkbox" name="terms" required />
      I agree to the terms and conditions<br /><br />

      <!-- Textarea -->
      <label>Additional Requests:</label><br />
      <textarea rows="4" cols="40"></textarea><br /><br />

      <!-- Submit button -->
      <input type="submit" value="Submit Booking" />
    </form>

    <br />
    <a href="index.html">← Back to Home</a>

    <script src="script.js"></script>
  </body>
</html>
